<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Maple City — Sync</title>
<style>
  :root{ --paper:#faf7f0; --ink:#1c1a16; --sub:#726b5c; --maple:#ab4020; --ok:#1f8a4c; }
  @media (prefers-color-scheme: dark){ :root{ --paper:#0d0f14; --ink:#eae6dc; --sub:#9b9484; --maple:#e0705a; --ok:#4cc380; } }
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
  .box{max-width:340px}
  h1{font-size:19px;margin:0 0 8px}
  p{margin:0;color:var(--sub);font-size:14.5px}
  .ok h1{color:var(--ok)} .err h1{color:var(--maple)}
  .big{font-size:44px;line-height:1;margin-bottom:10px}
  .spin{width:30px;height:30px;border:3px solid var(--sub);border-top-color:transparent;border-radius:99px;margin:0 auto 14px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="box"><p>Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var box = document.getElementById('box');
  function show(kind, big, title, msg){
    box.className = 'box ' + kind;
    box.innerHTML = (kind==='work' ? '<div class="spin"></div>' : '<div class="big">'+big+'</div>') +
      '<h1></h1><p></p>';
    box.querySelector('h1').textContent = title;
    box.querySelector('p').textContent = msg || '';
  }
  var cfg = window.PORTAL_CONFIG || {};
  var client = (cfg.url && cfg.anonKey && window.supabase) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;

  async function doSync(req){
    if (!client) throw new Error('Portal is missing its config.js values.');
    var res = await client.rpc('sync_patient_page', {
      p_code: req.code, p_name: req.name, p_html: req.html, p_admin_key: req.adminKey
    });
    if (res.error) throw new Error(res.error.message || 'Sync failed.');
  }
  function tellOpener(msg){
    try{ if (window.opener) window.opener.postMessage(msg, '*'); }catch(e){}
  }

  /* payload in the link: #g.<base64url gzip json>  or  #p.<base64url json> */
  function b64urlToBytes(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function readHashPayload(h){
    var kind = h.charAt(0), data = b64urlToBytes(h.slice(2));
    if (kind === 'g'){
      var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'));
      var text = await new Response(stream).text();
      return JSON.parse(text);
    }
    return JSON.parse(new TextDecoder().decode(data));
  }

  var hash = (location.hash || '').replace(/^#/, '');
  if (/^[gp]\./.test(hash)){
    // Direct mode: everything needed arrived in the link, so this page does the
    // saving itself. Works even when the browser hides which app opened it.
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
    show('work','', 'Syncing…', 'One moment.');
    (async function(){
      try{
        var req = await readHashPayload(hash);
        await doSync(req);
        show('ok','✓', 'Synced', (req.name ? req.name + '’s program is live.' : 'Program is live.') + ' You can close this tab and go back to the app.');
        tellOpener({ type:'mchep-sync-result', ok:true, code:req.code });
      }catch(e){
        var m = (e && e.message) || 'Something went wrong.';
        show('err','!', 'Sync failed', m);
        tellOpener({ type:'mchep-sync-result', ok:false, error:m });
      }
    })();
  } else if (window.opener){
    // Popup mode (desktop): the clinician app sends the program by message.
    show('work','', 'Waiting for the clinician app…', '');
    window.addEventListener('message', async function(ev){
      var d = ev.data || {};
      if (d.type !== 'mchep-sync-request') return;
      try{
        await doSync(d);
        ev.source.postMessage({ type:'mchep-sync-result', ok:true, code:d.code }, '*');
        show('ok','✓','Synced','You can close this tab.');
      }catch(e){
        var m = (e && e.message) || 'Sync failed.';
        ev.source.postMessage({ type:'mchep-sync-result', ok:false, error:m }, '*');
        show('err','!','Sync failed', m);
      }
    });
    window.opener.postMessage({ type:'mchep-relay-ready' }, '*');
  } else {
    show('err','', 'This page is only used by the clinician app.', 'There’s nothing to do here on its own — you can close this tab.');
  }
})();
</script>
</body>
</html>
